name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  verify:
    name: Tests and static checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.13.14
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test Electron process modules
        run: npm run test:electron

      - name: Test Python backend contracts
        run: python -m unittest discover -s tests -v

      - name: Lint Python source
        run: python -m ruff check .

      - name: Type-check Python source
        run: npx pyright

      - name: Verify packaging context
        run: npm run verify:packaging-context

name: Bug report
description: Report a reproducible problem without sharing private data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, resumes, recordings, private emails, or other personal data.
  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit SHA.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no credentials, resumes, recordings, private emails, or other personal data.
          required: true

name: Feature request
description: Suggest an outcome that helps job-search workflows.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please describe the workflow outcome, not credentials or personal data.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Use synthetic examples only.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This request contains no credentials, resumes, recordings, private emails, or other personal data.
          required: true

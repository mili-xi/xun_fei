name: Adoption report
description: Share a real public use case for impact evidence.
title: "[Adoption]: "
labels: ["adoption"]
body:
  - type: markdown
    attributes:
      value: This is a public issue. Do not include credentials, resumes, recordings, email addresses, or other personal data.
  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit SHA used.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub Release installer
        - GitHub Release ZIP
        - Built from source
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Real use case
      description: Describe the job-search workflow without personal data.
    validations:
      required: true
  - type: input
    id: public_reference
    attributes:
      label: Optional public reference URL
    validations:
      required: false
  - type: checkboxes
    id: citation
    attributes:
      label: Optional citation permission
      options:
        - label: The maintainer may link or quote this public report in docs/impact.md.
          required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This public issue contains no credentials, resumes, recordings, email addresses, or other personal data.
          required: true
